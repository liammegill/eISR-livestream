# eISR team overlay config
#
# Folder structure this file assumes:
#   overlays/
#     team_overlay.html
#   data/
#     flags/
#     logos/
#     teams.yaml   <- this file
#
# One entry per team, keyed by team ID (lowercase, no spaces - this is the
# ID you'll pass to window.loadTeam('id') from the control stack / Launchpad).
#
# Fields per team:
#   flagCode      - ISO country code (e.g. CA, DE, FR) used to look up the
#                   flag image. Regional/subnational codes (e.g. QC) can be
#                   added to CUSTOM_FLAGS in the HTML file instead - those
#                   point at data/flags/.
#   logoUrl       - path to the team logo, relative to team_overlay.html
#                   (so ../data/logos/... since logos live in data/logos/).
#                   Leave blank/omit to fall back to logoInitials.
#   logoInitials  - 1-3 letters shown if logoUrl is not set
#   teamName      - display name, e.g. "Team OMER"
#   university    - full university/institution name
#   submarineName - name of the submarine entry
#   scoreboardTeam - the value of the "team" column on the subrace.eu results
#                    feed, if it differs from this entry's ID (case-insensitive).
#                    Used by overlays/last_runs_overlay.html to match feed rows
#                    back to a team here. Omit when the feed value already
#                    matches the ID (e.g. "omer" -> "Omer").

teams:
  default:
    flagCode: GB
    logoUrl: ../data/logos/logoT_eISR_white.png
    teamName: eISR
    university: European International Submarine Races, Gosport
