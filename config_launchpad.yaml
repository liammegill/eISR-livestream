obs:
  host: localhost
  port: 4455
  password: ""

devices:
  launchpad: "Launchpad S"

# Velocity values for Launchpad S LED brightness/colour
colors:
  off: 12
  red: 15
  green: 60
  amber: 63
  yellow: 62

# ─── Launchpad S pad layout (note numbers) ────────────────────────────────────
#
#  The USB port is at the TOP of the device. Note numbering starts at the top.
#
#  Top row (USB side):   0   1   2   3   4   5   6   7  | side:   8
#  Overlays row:        16  17  18  19  20  21  22  23  | side:  24
#  Transitions row:     32  33  34  35  36  37  38  39  | side:  40
#  (unused):            48  49  50  51  52  53  54  55  | side:  56
#  (unused):            64  65  66  67  68  69  70  71  | side:  72
#  (unused):            80  81  82  83  84  85  86  87  | side:  88
#  (unused):            96  97  98  99 100 101 102 103  | side: 104
#  Bottom row:         112 113 114 115 116 117 118 119  | side: 120
#
#  Top automap buttons are sent as CC messages 104–111 (not covered here yet).
# ──────────────────────────────────────────────────────────────────────────────

launchpad_buttons:

  # ── SCENES ─────────────────────────────────────────────────────────────────
  0:
    label: "Starting Soon"
    action: scene
    target: "Starting Soon"

  1:
    label: "Main Race"
    action: scene
    target: "Main Race"

  2:
    label: "Scoreboard"
    action: scene
    target: "Scoreboard"

  3:
    label: "Replay"
    action: scene
    target: "Replay"

  4:
    label: "Interview"
    action: scene
    target: "Interview"

  5:
    label: "Be Right Back"
    action: scene
    target: "Be Right Back"

  # ── OVERLAYS ────────────────────────────────────────────────────────────────
  # "scene" and "source" must match OBS names exactly.
  16:
    label: "Lower Third"
    action: toggle_source
    scene: "Main Race"
    source: "Lower Third"

  17:
    label: "Race Timer"
    action: toggle_source
    scene: "Main Race"
    source: "Race Timer"

  18:
    label: "Standings Board"
    action: toggle_source
    scene: "Main Race"
    source: "Standings Board"

  19:
    label: "Sponsor Logo"
    action: toggle_source
    scene: "Main Race"
    source: "Sponsor Logo"

  # ── TRANSITIONS ─────────────────────────────────────────────────────────────
  # "transition" must match an OBS transition name exactly.
  32:
    label: "Cut"
    action: set_transition
    transition: "Cut"

  33:
    label: "Fade"
    action: set_transition
    transition: "Fade"

  # ── RECORDING ───────────────────────────────────────────────────────────────
  # Right-side button 8 (top of right column).
  8:
    label: "Record"
    action: start_stop_recording
